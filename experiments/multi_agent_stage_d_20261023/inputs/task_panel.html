<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仓库修复 · 任务面板</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#1c2833;background:#f3f5f8;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#142b40;color:white;padding:26px 36px}h1{font-size:24px;margin:0 0 7px}header p{margin:0;color:#becddd}main{max-width:1500px;margin:auto;padding:24px;display:grid;grid-template-columns:365px minmax(0,1fr);gap:20px}.card{background:white;border:1px solid #dce2e9;border-radius:12px;padding:20px;margin-bottom:18px}h2{font-size:17px;margin:0 0 15px}label{display:block;margin:13px 0 6px;color:#52616e}select,button{font:inherit;border:1px solid #c8d1dc;border-radius:7px;padding:9px;background:white}select{width:100%}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:#166d68;color:white;border-color:#166d68;width:100%;margin-top:16px}.danger{color:#9e3030}.hint{color:#697784;font-size:12px;line-height:1.7}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.list{max-height:610px;overflow:auto}.item{display:block;width:100%;text-align:left;padding:13px 10px;border:0;border-bottom:1px solid #edf0f3;border-radius:0}.item:hover,.item.active{background:#eef6f5}.item strong{display:block;margin-bottom:5px}.item small{display:block;color:#71808e;overflow-wrap:anywhere}.tag{display:inline-block;font-size:12px;border:1px solid #d3dce5;padding:3px 7px;border-radius:20px;margin:5px 5px 0 0}.green{background:#eef8f0;color:#27683b}.red{background:#fceeee;color:#9a3434}.status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{padding:15px;background:#f5f7fa;border-radius:8px;overflow-wrap:anywhere}.stat small{display:block;color:#71808e;margin-bottom:8px}.stat b{font-size:17px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}.metrics .stat b{font-size:15px}pre{background:#f5f7fa;white-space:pre-wrap;overflow-wrap:anywhere;padding:15px;max-height:500px;overflow:auto;border-radius:8px;font:12px/1.65 Consolas,monospace}.artifacts{display:flex;gap:7px;flex-wrap:wrap}.events{max-height:420px;overflow:auto}.event{border-left:2px solid #b6cecc;padding:0 0 15px 13px;margin-left:3px}.event small{color:#75828d}.event pre{margin:5px 0 0;padding:8px;max-height:180px}#notice{min-height:24px;color:#a64127;line-height:1.6;margin-top:10px}#empty{padding:80px 30px;text-align:center;color:#7b8996}#detail{display:none}#scope{overflow-wrap:anywhere}@media(max-width:950px){main{grid-template-columns:1fr;padding:12px}.metrics{grid-template-columns:repeat(2,1fr)}.list{max-height:300px}header{padding:22px}}
</style></head><body>
<header><div class="row"><h1>仓库修复 · 任务面板</h1><button id="shutdown">停止面板服务</button></div><p>查看执行过程、代码补丁与独立验收。基于 Mini SWE Agent 的本地工程原型。</p></header>
<main><aside><section class="card"><h2>新建任务</h2><label for="mode">运行方式</label><select id="mode"><option value="replay">离线补丁重放 · 不调用模型</option><option value="live">真实 Agent 运行 · 调用模型 API</option></select><label for="collaborationMode">协作方式</label><select id="collaborationMode"><option value="single">单 Agent</option><option value="dual_review">双 Agent 审查（实验）</option></select><p id="collaborationHint" class="hint"></p><label for="task">固定仓库任务</label><select id="task"></select><label id="profileLabel" for="profile">策略</label><select id="profile"></select><p class="hint" id="modeHint">把已归档的补丁放到新副本上重新验收，不代表模型重新生成了修复。</p><button id="start" class="primary">创建并启动离线重放</button><div id="notice" role="status"></div><p class="hint">本机一次执行一个任务。关闭此页面不取消运行。真实运行沿用共享记账和现有保护。</p></section>
<section class="card"><div class="row"><h2>运行与历史</h2><button id="refresh">刷新</button></div><label for="filter">显示范围</label><select id="filter"><option value="all">全部记录</option><option value="current">本面板创建</option><option value="history">历史实验 · 只读</option></select><div class="list" id="runs"></div></section></aside>
<article><section id="empty" class="card">选择一条历史记录，查看补丁与验收；或先创建一次离线重放。</section><div id="detail"><section class="card"><div class="row"><h2 id="title"></h2><button id="cancel" class="danger">取消任务</button></div><p class="hint" id="identity"></p><div class="status-grid"><div class="stat"><small>执行流程</small><b id="flow"></b></div><div class="stat"><small>Agent 结束原因</small><b id="exit"></b></div><div class="stat"><small>独立修复验收</small><b id="repair"></b></div></div><div class="metrics" id="metrics"></div><p id="reason" class="hint"></p><details><summary>评价范围与来源</summary><p id="scope" class="hint"></p></details></section>
<section class="card" id="collaboration" hidden><h2>角色、版本与审查</h2><p id="collaborationStatus" class="hint"></p><div id="roles" class="status-grid"></div><h2 style="margin-top:20px">全角色用量</h2><div id="collaborationUsage" class="metrics"></div><pre id="providerUsage"></pre><label for="candidateVersion">候选版本（各版本的检查独立显示）</label><select id="candidateVersion"></select><pre id="candidateContent"></pre><div id="candidateReviews"></div><pre id="evidenceContent"></pre><details><summary>交接包、证据索引与响应</summary><pre id="handoffs"></pre></details></section><section class="card"><h2>运行级补丁与成果</h2><div id="artifacts" class="artifacts"></div><pre id="artifact">选择一个成果查看内容。空补丁或未知成绩会如实保留。</pre></section><section class="card"><h2>动作与事件</h2><label for="roleFilter">事件角色（始终保留总控/取消/异常）</label><select id="roleFilter"><option value="all">全部</option><option value="repairer">修复者</option><option value="reviewer">审查者</option></select><div id="events" class="events"></div></section></div></article></main>
<script>
const token='__TASK_TOKEN__';let selected=null,items=[],tasks=[],lastEvent=0,currentEvents=[],artifactKey='',busy=false,pollHandle=null,selectionRevision=0;const $=id=>document.getElementById(id);
const names={'click-custom-command':'Click · 自定义命令注册','barrel-sort':'boltons · 大容器排序','click-shared-parameter':'Click · 参数配置复用','requests-json-pickle':'Requests · 异常序列化','omd-copy':'boltons · 多值字典复制','file-pathlike':'boltons · 路径兼容','split-after-boundary':'more-itertools · 分割边界','indexed-set-removal':'boltons · 集合切片'};
const flowNames={queued:'排队中',running:'运行中',cancel_requested:'正在取消',cancelled:'已取消',finished:'已结束',failed:'处理异常',interrupted:'执行中断'};
const stages={preparing:'准备副本',baseline:'修复前检查',preflight:'环境预检',agent:'Agent执行',replaying_patch:'应用历史补丁',verification:'独立验收',patch_verification:'新副本重放',done:'收尾完成',historical:'历史记录'};
const eventNames={created:'创建任务',worker_claimed:'执行器接手',stage:'阶段更新',workspace_ready:'工作副本已准备',model_request:'请求下一步动作',model_usage:'用量已更新',usage_reserved:'调用已登记',action_started:'执行命令',action_finished:'命令结果',run_ended:'任务已收尾',agent_ended:'Agent已结束',cancel_requested:'已请求取消',cancelled_before_start:'排队任务已取消',worker_interrupted:'执行中断',worker_error:'执行器异常',archived_patch_applied:'已应用历史补丁',history_imported:'历史结果索引',historical_action:'历史命令',history_actions_indexed:'历史动作索引完成'};const actorNames={system:'系统',repairer:'修复者',replay:'离线重放',reviewer:'审查者'};const repairs={passed:'通过',failed:'未通过',not_run:'未验收',unknown:'未知'};
async function api(path,body){let r=await fetch(path,{headers:{'X-Task-Token':token,...(body?{'Content-Type':'application/json'}:{})},...(body?{method:'POST',body:JSON.stringify(body)}:{})});let data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data}
function text(el,value){el.textContent=value??'未知'}function node(tag,content,cls){let el=document.createElement(tag);text(el,content);if(cls)el.className=cls;return el}
function choices(){let prev=$('task').value;$('task').replaceChildren();let list=$('mode').value==='replay'?tasks.filter(t=>['click-custom-command','barrel-sort'].includes(t.id)):tasks;for(let t of list){let o=node('option',names[t.id]||t.id);o.value=t.id;$('task').append(o)}if(list.some(t=>t.id===prev))$('task').value=prev;$('profile').style.display=$('profileLabel').style.display=$('mode').value==='replay'?'none':'';$('start').textContent=$('mode').value==='replay'?'创建并启动离线重放':'创建并启动真实 Agent';$('modeHint').textContent=$('mode').value==='replay'?'把已有补丁应用到新副本后重新验收；不调用模型，也不是新修复成绩。':'会调用模型并累计共享用量；当前策略为实验选项，本地固定任务不是官方 SWE-bench。'}
const originalChoices=choices;choices=function(){originalChoices();if(typeof collaborationChoices==='function')collaborationChoices();};
function list(){let box=$('runs');box.replaceChildren();let filter=$('filter').value;let rows=items.filter(r=>filter==='all'||(filter==='history')===(['history','collaboration_history'].includes(r.kind)));for(let row of rows){let b=node('button','', 'item'+(selected===row.id?' active':''));b.append(node('strong',names[row.task]||row.task),node('small',row.profile),node('span',flowNames[row.status]||row.status,'tag'),node('span',repairs[row.repair_result]||'未知','tag '+(row.repair_result==='passed'?'green':row.repair_result==='failed'?'red':'')),node('small',['history','collaboration_history'].includes(row.kind)?'历史 · '+row.source:row.kind==='collaboration_mock'?'离线人工夹具 · ':row.kind==='replay'?'离线重放 · '+row.id.slice(0,8):'真实运行 · '+row.id.slice(0,8)));b.onclick=()=>select(row.id);box.append(b)}if(!rows.length)box.append(node('p','暂无记录','hint'))}
function select(id){resetCollaboration();selected=id;sessionStorage.setItem('selectedTask',id);selectionRevision++;lastEvent=0;currentEvents=[];artifactKey='';$('artifact').textContent='选择一个成果查看内容。';$('detail').style.display='none';$('empty').style.display='block';$('empty').textContent='正在加载所选任务…';refresh().catch(notice)}
function notice(error){text($('notice'),error.message||error)}
function stat(label,value){let el=node('div','','stat');el.append(node('small',label),node('b',value));return el}
function display(row){$('detail').style.display='block';$('empty').style.display='none';text($('title'),names[row.task]||row.task);text($('identity'),row.kind+' · '+row.id+' · '+row.profile);text($('flow'),(flowNames[row.status]||row.status)+' / '+(stages[row.stage]||row.stage));text($('exit'),({Submitted:'正常提交',LimitsExceeded:'运行保护停止',NoProgress:'重复动作停止',TimeExceeded:'超过运行时间',ProviderUnavailable:'模型服务不可用',Cancelled:'已取消',OfflinePatchReplay:'未运行模型 · 补丁重放'}[row.agent_exit]||row.agent_exit||'尚无记录'));text($('repair'),repairs[row.repair_result]);text($('reason'),row.reason);text($('scope'),row.scope+(row.source?'\n来源：'+row.source:''));$('cancel').disabled=['history','collaboration_history'].includes(row.kind)||!['queued','running','cancel_requested'].includes(row.status);$('metrics').style.display=row.kind.startsWith('collaboration_')?'none':'';let m=row.metrics||{};let amount=m.known_price_estimate_cny==null?'未知':Number(m.known_price_estimate_cny).toFixed(6)+' 元';$('metrics').replaceChildren(stat('接口尝试 / 成功响应',(m.requests??'未知')+' / '+(m.successful_responses??'未知')),stat('输入 / 输出 token',(m.prompt_tokens??'未知')+' / '+(m.completion_tokens??'未知')),stat('已知价格保守估算',amount),stat('完整费用',m.complete_cost_estimate_cny==null?'未知':Number(m.complete_cost_estimate_cny).toFixed(6)+' 元'));if(m.unknown_placeholder_cny)$('metrics').append(stat('未知请求占位 · 不是收费',Number(m.unknown_placeholder_cny).toFixed(2)+' 元'));if(m.total_elapsed_seconds!=null)$('metrics').append(stat('准备至收尾总耗时',m.total_elapsed_seconds+' 秒'));let arts=$('artifacts');arts.replaceChildren();for(let name of Object.keys(row.artifacts||{})){let b=node('button',name);b.onclick=async()=>{let rev=selectionRevision;try{let r=await fetch('/api/runs/'+row.id+'/artifacts/'+encodeURIComponent(name),{headers:{'X-Task-Token':token}});if(!r.ok)throw Error('成果暂不可用');let content=await r.text();if(selected!==row.id||selectionRevision!==rev)return;text($('artifact'),content);artifactKey=name}catch(e){notice(e)}};arts.append(b)}if(!arts.childNodes.length)arts.append(node('p','成果尚未收集；可以先查看下方事件。','hint'))}
async function refresh(){let revision=selectionRevision;items=await api('/api/runs');list();if(!selected||revision!==selectionRevision)return;let row=items.find(x=>x.id===selected);if(!row)return;display(row);await refreshCollaboration(row,revision);if(revision!==selectionRevision)return;let runId=selected;let more=await api('/api/runs/'+runId+'/events?after='+lastEvent);if(revision!==selectionRevision||runId!==selected)return;for(let e of more){if(e.seq>lastEvent){lastEvent=e.seq;currentEvents.push(e)}}let box=$('events');box.replaceChildren();for(let e of currentEvents.filter(e=>$('roleFilter').value==='all'||e.actor===$('roleFilter').value||!['repairer','reviewer'].includes(e.actor)||/cancel|interrupt|stop|error/.test(e.kind)).slice(-100).reverse()){let div=node('div','','event');div.append(node('small',new Date(e.at).toLocaleString('zh-CN',{hour12:false})+' · '+(actorNames[e.actor]||e.actor)),node('div',eventNames[e.kind]||e.kind),node('pre',e.kind==='model_usage'?'接口尝试 '+e.data.metrics.requests+' / 成功响应 '+e.data.metrics.successful_responses+'；输入 '+e.data.metrics.prompt_tokens+'、输出 '+e.data.metrics.completion_tokens+' token':e.kind==='usage_reserved'?'本次调用凭证已关联运行记录；原始字段保留在事件数据中。':JSON.stringify(e.data,null,2)));box.append(div)}}
$('shutdown').onclick=async()=>{try{await api('/api/shutdown',{});clearInterval(pollHandle);$('notice').textContent='面板服务已停止。历史记录已保存；下次双击启动入口即可重新打开。';for(let id of ['start','cancel','refresh','shutdown'])$(id).disabled=true}catch(e){notice(e)}};$('mode').onchange=choices;$('filter').onchange=list;$('refresh').onclick=()=>refresh().catch(notice);$('cancel').onclick=async()=>{try{await api('/api/runs/'+selected+'/cancel',{});await refresh()}catch(e){notice(e)}};
$('start').onclick=async()=>{if(busy)return;busy=true;$('start').disabled=true;$('notice').textContent='';try{let request={task:$('task').value,profile:$('mode').value==='replay'?'retrieval_on_change':$('profile').value,mode:$('mode').value,collaboration_mode:$('collaborationMode').value,policy_version:1};let signature=JSON.stringify(request),saved=JSON.parse(sessionStorage.getItem('pendingTask')||'null');if(saved&&saved.signature!==signature)throw Error('上次创建结果尚不明确，请先恢复原选项并重试；请求身份会保留以避免重复计费。');let key=saved?.key||crypto.randomUUID();sessionStorage.setItem('pendingTask',JSON.stringify({signature,key}));let r=await api('/api/runs',{...request,request_key:key});sessionStorage.removeItem('pendingTask');select(r.id)}catch(e){notice(e)}finally{busy=false;$('start').disabled=false}};
(async()=>{let c=await api('/api/catalog');tasks=c.tasks;collaborationAvailable=c.collaboration_available;for(let [key,value]of Object.entries(c.profiles)){let o=node('option',value);o.value=key;$('profile').append(o)}for(let t of c.tasks)names[t.task_id]=names[t.id]||t.id;names['more-itertools-windowed-empty-462']='more-itertools · 空输入滑动窗口';$('profile').value='raw';choices();await refresh();if(items.length)select(items.some(r=>r.id===sessionStorage.getItem('selectedTask'))?sessionStorage.getItem('selectedTask'):items[0].id);pollHandle=setInterval(()=>refresh().catch(notice),2000)})().catch(notice);
</script><script src="/collaboration-panel.js"></script></body></html>
